name: pokemon_app_evertec
description: "Prueba Técnica Evertec. Leimar Nazarit 2026"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.0.0
  google_fonts: ^8.0.2
  flutter_native_splash: ^2.4.1
  firebase_auth: ^6.1.4
  google_sign_in: ^7.2.0
  equatable: ^2.0.5
  flutter_bloc: ^9.1.1
  http: ^1.2.2
  lottie: ^3.1.3
  audioplayers: ^6.1.0
  get_it: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/pixel.png

# Splash screen: modo claro y oscuro
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/pixel.png
  color_dark: "#121212"
  image_dark: assets/images/pixel.png
  android_12:
    color: "#ffffff"
    color_dark: "#121212"
    image: assets/images/pixel.png
    image_dark: assets/images/pixel.png
    icon_background_color: "#ffffff"
    icon_background_color_dark: "#121212"